sources:
  - name: postgre_db
    database: DB45_BRONZE_DB
    config: 
      freshness: # default freshness
        # changed to config in v1.9
        warn_after: {count: 12, period: hour}
        error_after: {count: 24, period: hour}
      loaded_at_field: _etl_loaded_at # changed to config in v1.10

    tables:
      - name: addresses
        config:
          freshness: # make this a little more strict
            warn_after: {count: 6, period: hour}
            error_after: {count: 12, period: hour}

      - name: orders # this inherits the default freshness defined in the jaffle_shop source block at the beginning


      - name: order_items # this inherits the default freshness defined in the jaffle_shop source block at the beginning

      - name: products # this inherits the default freshness defined in the jaffle_shop source block at the beginning

      - name: promos # this inherits the default freshness defined in the jaffle_shop source block at the beginning

      - name: user # this inherits the default freshness defined in the jaffle_shop source block at the beginning