sources:
  - name: google_sheet
    database: DB45_BRONZE_DB
    schema: google_sheet
  
    
    config: 
      freshness: # default freshness
        # changed to config in v1.9
        warn_after: {count: 12, period: hour}
        error_after: {count: 24, period: hour}
      loaded_at_field: _etl_loaded_at # changed to config in v1.10

    tables:

      - name: budget # this inherits the default freshness defined in the jaffle_shop source block at the beginning


      - name: users
        columns:
          - name: Nombre
          - name: DNI
          - name: email
          - name: fecha_alta_sistema